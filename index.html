
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CEST_UI User Manual</title>
  <meta name="description" content="User Manual for the CEST_UI Docker Image Installation and Application" />

  <!-- Docsify theme -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css" />

  <style>
    :root {
      --theme-color: #e05a3a;
      --sidebar-width: 280px;
      --base-font-size: 15px;
    }

    /* ── Sidebar shell ───────────────────────────── */
    .sidebar {
      background: #ffffff;
      border-right: 1px solid #efefef;
      padding-top: 0 !important;
    }

    /* ── Logo + title row ────────────────────────── */
    .app-name {
      padding: 20px 16px 12px 16px !important;
      border-bottom: 1px solid #f0f0f0;
      margin-bottom: 8px;
    }
    .app-name-link {
      display: flex !important;
      align-items: center;
      gap: 10px;
      text-decoration: none !important;
    }
    .app-name-link img {
      width: 28px;
      height: 28px;
      border-radius: 5px;
      object-fit: cover;
      flex-shrink: 0;
    }
    .app-name-link span {
      font-size: 14px;
      font-weight: 700;
      color: #1a1a1a;
      letter-spacing: -0.01em;
      line-height: 1.3;
    }

    /* ── Sidebar nav items ───────────────────────── */
    .sidebar-nav ul {
      padding: 0 8px !important;
    }
    .sidebar-nav > ul > li > a,
    .sidebar-nav > ul > li > p {
      font-size: 12px !important;
      font-weight: 600 !important;
      text-transform: uppercase !important;
      letter-spacing: 0.06em !important;
      color: #8a8a8a !important;
      padding: 6px 10px !important;
      border-radius: 6px;
      display: block;
    }
    .sidebar-nav li a {
      font-size: 13.5px;
      color: #444 !important;
      padding: 5px 10px;
      border-radius: 6px;
      display: block;
      transition: background 0.15s ease, color 0.15s ease;
      text-decoration: none !important;
    }

    /* Hover: light gray, like GitBook */
    .sidebar-nav li a:hover {
      background: #f3f3f3;
      color: #1a1a1a !important;
    }

    /* Active / current page: soft salmon background + accent border */
    .sidebar-nav li.active > a,
    .sidebar-nav li > a.active {
      background: #fef1ee !important;
      color: #e05a3a !important;
      font-weight: 600 !important;
      border-left: 3px solid #e05a3a;
      padding-left: 7px !important;
    }

    /* ── Search box ──────────────────────────────── */
    .search input {
      border-radius: 6px !important;
      border: 1px solid #e0e0e0 !important;
      font-size: 13px !important;
      padding: 7px 12px 7px 32px !important;
      background: #f7f7f7 !important;
    }
    .search input:focus {
      border-color: #e05a3a !important;
      background: #fff !important;
      outline: none !important;
    }

    /* ── Warning callout  (!> syntax) ───────────────
       Matches GitBook's red warning block (Image 1)   */
    .tip {
      position: relative;
      background: #fff5f5 !important;
      border-left: 4px solid #e05a3a !important;
      border-radius: 0 6px 6px 0;
      padding: 12px 14px 12px 42px !important;
      margin: 1.2em 0;
      font-size: 14px;
      line-height: 1.6;
      color: #3d2b2b;
    }
    .tip::before {
      content: "⚠";
      position: absolute;
      left: 13px;
      top: 13px;
      font-size: 15px;
      color: #e05a3a;
    }
    .tip strong:first-child {
      color: #c0392b;
    }

    /* ── Info / Note callout  (?> syntax) ────────────
       Matches GitBook's yellow note block (Image 2)   */
    .warn {
      position: relative;
      background: #fffbf0 !important;
      border-left: 4px solid #f0a500 !important;
      border-radius: 0 6px 6px 0;
      padding: 12px 14px 12px 42px !important;
      margin: 1.2em 0;
      font-size: 14px;
      line-height: 1.6;
      color: #3d3520;
    }
    .warn::before {
      content: "ℹ";
      position: absolute;
      left: 13px;
      top: 12px;
      font-size: 15px;
      color: #f0a500;
    }

    /* ── Pagination (Prev / Next) ────────────────── */
    .pagination-item {
      padding: 14px 0 !important;
    }
    .pagination-item a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13.5px;
      font-weight: 500;
      color: #555 !important;
      text-decoration: none !important;
      padding: 8px 14px;
      border: 1px solid #e5e5e5;
      border-radius: 7px;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .pagination-item a:hover {
      border-color: #e05a3a;
      color: #e05a3a !important;
      background: #fff7f5;
    }
    .pagination-item--previous a::before {
      content: "←";
      font-size: 15px;
    }
    .pagination-item--next a::after {
      content: "→";
      font-size: 15px;
    }
    .pagination-item-title {
      font-size: 13px;
      opacity: 0.75;
    }

    /* ── Video embeds ────────────────────────────── */
    .video-wrapper {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      margin: 1.5em 0;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    }
    .video-wrapper iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div id="app">Loading...</div>

  <script>
    window.$docsify = {
      name: '<img src=".gitbook/assets/logo_quantimbLab_Square.jpg" /><span>CEST_UI Manual</span>',
      repo: '',                      // Optional: add your GitHub repo URL here
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      search: {
        placeholder: 'Search manual...',
        noData: 'No results found.',
        depth: 3,
      },
      pagination: {
        previousText: '← Previous',
        nextText: 'Next →',
        crossChapter: true,
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied!'
      },
      plugins: [],
    };
  </script>

  <!-- Docsify core -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>

  <!-- Plugins -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/js/docsify-themeable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
</body>
</html>
